name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Offline test suite
        run: pytest -q
      - name: CLI smoke test
        run: |
          citeaudit --version
          citeaudit --help

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" mypy pyflakes pytest-cov

      - name: Dead code and unused imports
        run: python -m pyflakes src/citeaudit scripts tests

      - name: Static types
        run: python -m mypy src/citeaudit --ignore-missing-imports

      - name: Coverage floor
        # The floor exists to stop coverage sliding, not to chase a number.
        # cli.py and http.py sat at 0% and 39% while carrying the exit-code
        # contract and the NOT_FOUND/UNREACHABLE distinction respectively.
        run: pytest -q --cov=citeaudit --cov-report=term --cov-fail-under=80

      - name: Self-audit — run citeaudit on its own documentation
        run: |
          python -m citeaudit.cli README.md docs/*.md \
            --no-urls --no-search --format markdown \
            >> "$GITHUB_STEP_SUMMARY"
