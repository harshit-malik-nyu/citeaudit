[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citeaudit"
version = "0.1.0"
description = "Verify that the citations in a document actually exist."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["citations", "verification", "doi", "crossref", "arxiv",
            "research-integrity", "fact-checking", "ai-hallucination"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["rapidfuzz>=3.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.0"]
all = ["pypdf>=4.0", "python-docx>=1.0"]
dev = ["pytest>=7.4", "pypdf>=4.0", "python-docx>=1.0"]

[project.scripts]
citeaudit = "citeaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: hits real external APIs; excluded from the default run"]
addopts = "-m 'not live'"
