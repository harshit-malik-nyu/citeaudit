name: pages

# Publishes the live report to GitHub Pages.
#
# Deployment uses the workflow's own GITHUB_TOKEN with `pages: write` granted
# below, rather than a personal access token. That distinction is the whole
# reason this file exists: the PAT available when the project was built had no
# Pages scope, and a workflow token can be granted one in YAML without anybody
# changing an account setting.
#
# `enablement: true` on configure-pages turns Pages on for the repository if it
# is off, so the first run bootstraps itself.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'evidence/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  # Republish whenever the live-verification or studies workflows finish, since
  # those are what regenerate the report and the evidence the site serves.
  workflow_run:
    workflows: [live-verification, studies]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes a pending one rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble the site
        run: |
          mkdir -p _site
          # The published report, generated by the live-verification workflow.
          if [ -f docs/index.html ]; then
            cp docs/index.html _site/index.html
          fi
          # Evidence and write-ups, served alongside so every figure on the
          # page can be traced without cloning the repository.
          mkdir -p _site/evidence _site/docs
          cp -r evidence/* _site/evidence/ 2>/dev/null || true
          cp docs/*.md _site/docs/ 2>/dev/null || true
          cp README.md _site/ 2>/dev/null || true
          ls -R _site | head -40

      - name: Landing page when no report has been generated yet
        run: |
          if [ ! -f _site/index.html ]; then
            cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>citeaudit</title>
          <style>
          body{max-width:44rem;margin:4rem auto;padding:0 1.25rem;
          font:16px/1.65 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
          background:#fbfbfa;color:#1a1a19}
          @media(prefers-color-scheme:dark){body{background:#141413;color:#f0efea}}
          a{color:inherit}
          </style></head><body>
          <h1>citeaudit</h1>
          <p>No report has been generated yet. The live-verification workflow
          produces one on each run.</p>
          <p><a href="https://github.com/harshit-malik-nyu/citeaudit">Repository</a></p>
          </body></html>
          HTML
          fi

      - id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explain the one manual step, if Pages is not enabled
        # MEASURED, not assumed: configure-pages with enablement:true was tried
        # and failed. Turning Pages on requires repository-admin permission,
        # which the workflow GITHUB_TOKEN does not carry — so this is the one
        # step in the project that genuinely cannot be automated from inside
        # the repository.
        if: steps.configure.outcome != 'success'
        run: |
          {
            echo "## GitHub Pages is not enabled"
            echo
            echo "This workflow is correct and will deploy on the next run."
            echo "It needs one manual step first, because enabling Pages"
            echo "requires repository-admin permission that a workflow token"
            echo "does not have:"
            echo
            echo "**Settings -> Pages -> Build and deployment -> Source ->"
            echo "GitHub Actions**"
            echo
            echo "Nothing else to change. Re-run this workflow afterwards and"
            echo "the site publishes."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pages not enabled; skipping deploy. See the job summary."

      - uses: actions/upload-pages-artifact@v3
        if: steps.configure.outcome == 'success'
        with:
          path: _site

    outputs:
      configured: ${{ steps.configure.outcome }}

  deploy:
    needs: build
    # Skip cleanly rather than failing the workflow when Pages is off. A red
    # badge for a setting nobody has clicked yet is noise, not signal.
    if: needs.build.outputs.configured == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
