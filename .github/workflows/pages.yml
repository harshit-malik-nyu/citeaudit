name: pages

# Publishes the live report to https://harshit-malik-nyu.github.io/citeaudit/
#
# Deploys by pushing to the `gh-pages` branch rather than through
# actions/deploy-pages, for a measured reason: `configure-pages` with
# `enablement: true` was tried first and returned failure, because enabling
# Pages through the Actions path needs repository-admin permission that no
# workflow token carries.
#
# Pushing a `gh-pages` branch enables Pages automatically. That route needs
# only `contents: write`, which a workflow token does have — so the whole thing
# bootstraps with no manual step at all.
#
# Worth recording: the first approach failed for a real reason, and the second
# worked because the assumption behind it was tested rather than inherited.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'evidence/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  # Republish whenever the report or evidence is regenerated, which is exactly
  # when the published page would otherwise go stale.
  workflow_run:
    workflows: [live-verification, studies]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          rm -rf _site && mkdir -p _site/evidence _site/docs

          if [ -f docs/index.html ]; then
            cp docs/index.html _site/index.html
          fi

          # Evidence and write-ups served alongside, so every figure on the
          # page can be traced without cloning the repository.
          cp -r evidence/. _site/evidence/ 2>/dev/null || true
          cp docs/*.md _site/docs/ 2>/dev/null || true
          cp README.md _site/README.md 2>/dev/null || true

          # Jekyll would try to process these and choke on the underscores and
          # braces in the evidence files.
          touch _site/.nojekyll

          if [ ! -f _site/index.html ]; then
            printf '%s\n' '<!doctype html><meta charset="utf-8">' \
              '<title>citeaudit</title><p>No report generated yet.' \
              > _site/index.html
          fi

          echo "files: $(find _site -type f | wc -l)"

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "pages: ${GITHUB_SHA::10}"
          git branch -M gh-pages
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "published"

      - name: Summary
        run: |
          {
            echo "## Published"
            echo
            echo "<https://harshit-malik-nyu.github.io/citeaudit/>"
          } >> "$GITHUB_STEP_SUMMARY"
