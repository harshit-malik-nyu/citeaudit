name: 'citeaudit'
description: 'Verify that the citations in your documents actually exist.'
author: 'citeaudit'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  paths:
    description: 'Files to check (space-separated, globs allowed)'
    required: true
  fail-on-findings:
    description: 'Fail the job when a citation does not hold up'
    required: false
    default: 'true'
  strict:
    description: 'Also fail on inconclusive checks'
    required: false
    default: 'false'
  fail-under:
    description: 'Fail if the integrity score falls below this percentage'
    required: false
    default: ''
  mailto:
    description: 'Contact address sent to scholarly APIs (polite pool)'
    required: false
    default: ''
  report-path:
    description: 'Where to write the HTML report'
    required: false
    default: 'citeaudit-report.html'

outputs:
  total:
    description: 'Citations checked'
    value: ${{ steps.run.outputs.total }}
  failures:
    description: 'Citations that did not hold up'
    value: ${{ steps.run.outputs.failures }}
  score:
    description: 'Integrity score, 0-100, over conclusive checks'
    value: ${{ steps.run.outputs.score }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install citeaudit
      shell: bash
      env:
        CITEAUDIT_ACTION_PATH: ${{ github.action_path }}
      run: pip install --quiet "${CITEAUDIT_ACTION_PATH}[all]"

    - name: Run citeaudit
      id: run
      shell: bash
      env:
        CITEAUDIT_MAILTO: ${{ inputs.mailto }}
        CITEAUDIT_PATHS: ${{ inputs.paths }}
        CITEAUDIT_STRICT: ${{ inputs.strict }}
        CITEAUDIT_FAIL_UNDER: ${{ inputs.fail-under }}
        CITEAUDIT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        CITEAUDIT_REPORT_PATH: ${{ inputs.report-path }}
        CITEAUDIT_ACTION_PATH: ${{ github.action_path }}
      run: python "${CITEAUDIT_ACTION_PATH}/scripts/run_action.py"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: citeaudit-report
        path: ${{ inputs.report-path }}
        if-no-files-found: ignore
